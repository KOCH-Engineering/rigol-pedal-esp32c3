; Rigol Speaking Multimeter - ESP32-C3 foot pedal
; =================================================
; Board: "ESP32-C3 Super Mini" (cheap USB-C dev board, BOOT button on
; GPIO9, RESET button, castellated solder holes on both edges). PlatformIO
; doesn't have a dedicated "Super Mini" board entry, but it uses the same
; ESP32-C3 chip as Espressif's own DevKitM-1, so that board definition
; works fine for compiling/flashing.

[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; WiFiManager: handles the Wi-Fi setup captive portal (see src/main.cpp).
; If this exact registry reference ever fails to resolve/build, the
; project's GitHub URL is a drop-in replacement:
;   lib_deps = https://github.com/tzapu/WiFiManager.git
lib_deps =
    tzapu/WiFiManager
